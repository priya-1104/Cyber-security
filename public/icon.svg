<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1329"/>
      <stop offset="50%" stop-color="#090d16"/>
      <stop offset="100%" stop-color="#05080f"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#22d3ee" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0ea5e9" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="104" fill="url(#bgGrad)"/>
  <rect width="504" height="504" x="4" y="4" rx="100" fill="none" stroke="#0ea5e9" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Glowing outer halo -->
  <path d="M256 80 L390 142 C390 270 332 376 256 422 C180 376 122 270 122 142 Z"
        fill="none" stroke="#00f2fe" stroke-width="12" opacity="0.35" filter="url(#glow)"/>

  <!-- Shield Base Outline -->
  <path d="M256 94 L378 150 C378 262 326 356 256 398 C186 356 134 262 134 150 Z"
        fill="#0b172d" stroke="url(#shieldGrad)" stroke-width="8"/>

  <!-- Inner Shield Fill -->
  <path d="M256 112 L360 160 C360 252 316 332 256 370 C196 332 152 252 152 160 Z"
        fill="url(#glowGrad)" opacity="0.25"/>

  <!-- Shield Core Lock / AI Circuit -->
  <path d="M256 168 C232 168 214 186 214 210 L214 238 L206 238 C198 238 192 244 192 252 L192 314 C192 322 198 328 206 328 L306 328 C314 328 320 322 320 314 L320 252 C320 244 314 238 306 238 L298 238 L298 210 C298 186 280 168 256 168 Z M256 190 C267 190 276 199 276 210 L276 238 L236 238 L236 210 C236 199 245 190 256 190 Z"
        fill="#ffffff"/>

  <!-- Keyhole glow dot -->
  <circle cx="256" cy="274" r="8" fill="#0ea5e9"/>
  <rect x="253" y="278" width="6" height="18" rx="3" fill="#0ea5e9"/>

  <!-- AI Nodes / Defensive radar dots -->
  <circle cx="178" cy="220" r="5" fill="#38bdf8"/>
  <line x1="178" y1="220" x2="204" y2="246" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2,2"/>
  <circle cx="334" cy="220" r="5" fill="#38bdf8"/>
  <line x1="334" y1="220" x2="308" y2="246" stroke="#38bdf8" stroke-width="3" stroke-dasharray="2,2"/>
</svg>
